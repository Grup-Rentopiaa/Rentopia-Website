<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RENTOPIA | Daftar Akun</title>
    <link rel="stylesheet" href="auth.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
</head>

<body>

    <div class="register-container">
        <div class="form-side">
            <div class="register-box">
                <h2>Daftar Akun Baru</h2>
                <p class="subtitle">Gabung Rentopia dan mulai sewa barang favoritmu!</p>

                <form onsubmit="handleRegister(event)">
                    <div class="input-group">
                        <label for="reg-username">Username</label>
                        <input type="text" id="reg-username" placeholder="Masukkan nama lengkap" required>
                    </div>

                    <div class="input-group">
                        <label for="reg-email">Email</label>
                        <input type="email" id="reg-email" placeholder="email@kamu.com" required>
                    </div>

                    <div class="input-group">
                        <label for="reg-password">Password</label>
                        <input type="password" id="reg-password" placeholder="Buat password" required>
                    </div>

                    <div class="input-group">
                        <label for="reg-confirm-password">Konfirmasi Password</label>
                        <input type="password" id="reg-confirm-password" placeholder="Ulangi password" required>
                    </div>

                    <button type="submit" class="register-btn">Daftar Sekarang </button>
                </form>

                <div class="login-link">
                    Sudah punya akun? <a href="login.html">Login di sini</a>
                </div>
            </div>
        </div>

        <div class="visual-side">
            <div class="visual-content">
                <h1>Join Rentopia</h1>
                <p>Tempat terbaik untuk menyewa barang dengan aman, mudah, dan terpercaya.</p>
                <a href="index.html" class="visual-btn">Kembali ke Beranda</a>
            </div>
        </div>
    </div>
    <div id="cookie-banner" class="cookie-mobile-box">
        <div class="cookie-content">
            <div class="cookie-icon">🍪</div>
            <div class="cookie-text">
                <h4>Persetujuan Cookies</h4>
                <p>Rentopia menggunakan cookies untuk kenyamanan menyewa barang.</p>
            </div>
        </div>
        <div class="cookie-actions">
            <button onclick="acceptCookies()" class="cookie-btn-accept">SETUJU</button>
            <button onclick="closeCookieBanner()" class="cookie-btn-later">NANTI</button>
        </div>
    </div>

    <script src="auth.js"></script>
</body>

</html>
