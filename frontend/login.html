<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RENTOPIA | Login Akun</title>
    <link rel="stylesheet" href="auth.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
</head>

<body>

    <div class="register-container">
        <div class="form-side">
            <div class="register-box">
                <h2>Selamat Datang</h2>
                <p class="subtitle">Silakan login untuk mulai menyewa barang.</p>

                <form onsubmit="handleLogin(event)">
                    <div class="input-group">
                        <label for="login-username">Username</label>
                        <input type="text" id="login-username" placeholder="Masukkan username" required>
                    </div>

                    <div class="input-group">
                        <label for="login-password">Password</label>
                        <input type="password" id="login-password" placeholder="Masukkan password" required>
                    </div>

                    <button type="submit" class="register-btn">Masuk Sekarang</button>

                    <div class="login-link">
                        Belum punya akun? <a href="register.html">Daftar di sini</a>
                    </div>
                </form>
            </div>
        </div>

        <div class="visual-side">
            <div class="visual-content">
                <h1>Ready to Rent?</h1>
                <p>Temukan barang impianmu untuk disewa sekarang!</p>
                <a href="index.html" class="visual-btn">Kembali ke Beranda</a>
            </div>
        </div>
    </div>

    <div id="cookie-banner" class="cookie-mobile-box">
        <div class="cookie-content">
            <div class="cookie-icon">🍪</div>
            <div class="cookie-text">
                <h4>Persetujuan Cookies</h4>
                <p>Rentopia menggunakan cookies untuk kenyamanan menyewa barang.</p>
            </div>
        </div>
        <div class="cookie-actions">
            <button onclick="acceptCookies()" class="cookie-btn-accept">SETUJU</button>
            <button onclick="closeCookieBanner()" class="cookie-btn-later">NANTI</button>
        </div>
    </div>

    <script src="auth.js"></script>
</body>

</html>
