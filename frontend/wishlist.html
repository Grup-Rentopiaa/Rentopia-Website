<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RENTOPIA | Daftar Favorit ❤️</title>
    <link rel="stylesheet" href="wishlist.css">
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
</head>

<body>
    <div id="toast-container" class="toast-container"></div>
    <nav class="navbar">
        <nav class="navbar-main"
            style="position: fixed; top: 0; width: 100%; height: 75px; background: rgba(2, 33, 75, 0.9); backdrop-filter: blur(15px); z-index: 1000; display: flex; align-items: center; justify-content: space-between; padding: 0 25px; border-bottom: 1px solid rgba(255,255,255,0.1);">

            <div style="display: flex; align-items: center; gap: 15px;">
                <div onclick="location.href='dashboard.html'"
                    style="cursor: pointer; display: flex; align-items: center; background: rgba(255,255,255,0.1); padding: 8px; border-radius: 12px;">
                    <ion-icon name="arrow-back-outline" style="font-size: 24px; color: var(--primary);"></ion-icon>
                </div>
                <h3 class="logo-title" style="margin: 0; font-weight: 800; letter-spacing: 1px;">WISHLIST</h3>
            </div>

            <div class="icon-btn" onclick="location.href='cart.html'" style="position: relative; cursor: pointer;">
                <ion-icon name="cart-outline" style="font-size: 26px; color: var(--primary);"></ion-icon>
                <span class="badge" id="cart-count"
                    style="position: absolute; top: -5px; right: -8px; background: #ff4d4d; color: white; font-size: 10px; padding: 2px 6px; border-radius: 50%; font-weight: bold; border: 2px solid #0d0232;">0</span>
            </div>
        </nav>

        <main class="main-container" style="padding-top: 120px; min-height: 80vh;">
            <header style="display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 30px;">
                <div>
                    <h2 style="font-size: 32px; font-weight: 800;">Daftar Favorit</h2>
                    <p style="color: #aaa;">Ada <span id="wishlist-count"
                            style="color: #007BFF; font-weight: bold;">0</span> barang yang kamu incar.</p>
                    <div class="sorting-wrapper" style="margin-top: 15px;">
                        <select id="sort-wishlist" onchange="sortWishlist()"
                            style="background: rgba(255,255,255,0.05); color: white; border: 1px solid rgba(255,255,255,0.2); padding: 8px 15px; border-radius: 10px; cursor: pointer; font-family: 'Poppins'; outline: none;">
                            <option value="default">Urutkan Harga</option>
                            <option value="low">Termurah - Tertinggi</option>
                            <option value="high">Tertinggi - Termurah</option>
                        </select>
                    </div>
                </div>
                <button id="clear-wishlist" class="hero-action-btn" style="background: #ff4d4d; padding: 10px 20px;">
                    Hapus Semua
                </button>
            </header>

            <div id="wishlist-items" class="catalog-grid-full">
            </div>
            <footer class="footer-main"
                style="padding: 40px 0; background: rgba(2, 33, 75, 0.5); text-align: center; border-top: 1px solid rgba(255, 255, 255, 0.1);">
                <div class="footer-socials" style="margin-bottom: 20px;">
                    <a href="#" style="color: white; margin: 0 10px; font-size: 24px;"><ion-icon
                            name="logo-instagram"></ion-icon></a>
                    <a href="#" style="color: white; margin: 0 10px; font-size: 24px;"><ion-icon
                            name="logo-facebook"></ion-icon></a>
                </div>
                <div class="footer-bottom">
                    <p style="font-size: 12px; color: var(--text-muted);">&copy; 2026 Rentopia Team 3 - UINSA Surabaya
                    </p>
                </div>
                <div style="margin-top: 15px;">
                    <button onclick="exportWishlistToCSV()"
                        style="background: var(--primary); color: #02214b; font-weight: 800; border: none; padding: 10px 20px; border-radius: 10px; cursor: pointer; font-size: 11px;">
                        EKSPOR WISHLIST (CSV)
                    </button>
                </div>
            </footer>

            <div id="confirm-modal" class="modal-overlay">
                <div class="modal-content-box">
                    <div style="font-size: 60px; margin-bottom: 15px;">⚠️</div>
                    <h3 style="color: white; font-weight: 800; margin-bottom: 10px;">HAPUS SEMUA</h3>
                    <p style="color: #aaa; margin-bottom: 25px;">Data wishlist kamu akan dikosongkan secara permanen
                        Apakah yakin ?</p>

                    <div style="display: flex; gap: 10px;">
                        <button onclick="closeConfirmModal()" class="cookie-btn-later"
                            style="flex: 1; padding: 12px; border-radius: 12px;">TIDAK</button>
                        <button onclick="executeClearWishlist()" class="rent-action-btn"
                            style="flex: 1; background: #ff4d4d; border-radius: 12px;">IYA, HAPUS</button>
                    </div>
                </div>
            </div>

            <script src="wishlist.js"></script>
</body>

</html>
